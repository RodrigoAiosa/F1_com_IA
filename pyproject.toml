[project]
name = "f1-com-ia"
version = "0.1.0"
description = "Neuroevolução de carros de corrida (Interlagos)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pygame>=2.5", "matplotlib>=3.8", "pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
